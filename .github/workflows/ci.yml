# CI mínimo: roda os testes Python e JavaScript a cada push e Pull Request.
# Não usa segredos nem banco real: os testes criam um SQLite temporário próprio.
# Os testes de PostgreSQL ficam de fora (sem TEST_DATABASE_URL eles são ignorados).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela a execução anterior da mesma branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # versão mínima suportada pelo projeto

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testes Python
        run: python -m unittest discover -s tests -v

      - name: Testes Python pelo handler da Vercel
        run: TEST_VERCEL_HANDLER=1 python -m unittest discover -s tests -v

      - name: Sintaxe do JavaScript
        run: |
          node --check static/app.js
          node --check static/api.js
          node --check static/theme.js

      - name: Testes JavaScript
        run: node --test tests/*.cjs
